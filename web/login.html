<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/img/mapper-mark.svg" type="image/svg+xml">
  <script src="/transport.js"></script>
  <title>Sign in · Mapper</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#172554 0%,#1e40af 100%);font:15px/1.5 Inter,Roboto,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
    .login-container{width:100%;max-width:400px}
    .login-paper{background:#fff;color:#172331;border-radius:10px;box-shadow:0 8px 32px #0009;padding:32px}
    .login-content{display:flex;flex-direction:column;align-items:center}
    .login-banner{max-height:80px;max-width:100%;width:auto;height:auto;object-fit:contain;margin-bottom:20px}
    .login-pki-actions{width:100%}
    .login-pki-divider{display:flex;align-items:center;gap:12px;margin:0 0 12px;color:#1d4ed8;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .login-pki-divider::before,.login-pki-divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#1d4ed8b8)}
    .login-pki-divider::after{transform:scaleX(-1)}
    .login-pki-divider span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:8px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none}
    .btn-primary{background:#1e40af;color:#fff}
    .btn-primary:hover{background:#1d4ed8}
    .btn-outlined{background:#fff;color:#1e40af;border-color:#1e40af}
    .btn-outlined:hover{background:#eff6ff}
    .btn:disabled{opacity:.6;cursor:wait}
    .login-password-choice{margin-top:12px}
    .login-form{width:100%}
    .divider{display:flex;align-items:center;text-align:center;margin:16px 0;width:100%;color:#64748b;font-size:.8rem}
    .divider::before,.divider::after{content:"";flex:1;border-bottom:1px solid #e2e8f0}
    .divider span{padding:0 10px}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;margin-bottom:5px;font-weight:600;font-size:.9rem}
    .form-group input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:11px 12px;font:inherit}
    .form-group input:focus{outline:2px solid #93c5fd;border-color:#2563eb}
    .alert{width:100%;border-radius:8px;font-size:.85rem;margin:0 0 14px}
    .alert:not(:empty){padding:10px 12px;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .muted{color:#64748b;font-size:.9rem}
    .login-actions{display:grid;gap:10px;margin-top:16px}
    [hidden]{display:none!important}
    .locked-link{margin-top:16px}
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-paper">
      <div class="login-content">
        <img src="/img/mapper-logo.svg" alt="Mapper" class="login-banner">
        <div id="lockedPanel" class="login-form" hidden>
          <div class="alert" id="lockedMessage">The database is locked. Unlock it before signing in.</div>
          <a class="btn btn-primary" href="/unlock">Go to unlock</a>
        </div>
        <div id="mainView" class="login-form" hidden>
          <section class="login-pki-actions" aria-labelledby="pkiLabel">
            <div class="login-pki-divider"><span id="pkiLabel">◈ PKI card required</span></div>
            <button type="button" class="btn btn-outlined" id="certButton">▣ Login with Certificate</button>
          </section>
          <div id="passwordChoice" hidden>
            <button type="button" class="btn btn-primary login-password-choice" id="passwordChoiceButton">→ Login with User/Pass</button>
          </div>
          <form id="passwordForm" class="login-password-form" hidden>
            <div class="divider" id="orDivider" hidden><span>or</span></div>
            <div class="alert" id="passwordError" role="alert" aria-live="polite"></div>
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary" id="passwordSubmit">→ Sign In</button>
          </form>
        </div>
        <div id="certView" class="login-form" hidden>
          <div class="form-group">
            <label id="certTitle">Checking certificate support…</label>
            <div class="muted" id="certDescription">Contacting the Mapper server.</div>
          </div>
          <div class="alert" id="certError" role="alert" aria-live="polite"></div>
          <div class="login-actions">
            <button type="button" class="btn btn-primary" id="certRetry" hidden>↻ Retry</button>
            <a class="btn btn-outlined" href="/login" id="certBack" hidden>← Back to login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const mainView=document.querySelector('#mainView'),certView=document.querySelector('#certView'),lockedPanel=document.querySelector('#lockedPanel'),
      passwordChoice=document.querySelector('#passwordChoice'),passwordChoiceButton=document.querySelector('#passwordChoiceButton'),
      passwordForm=document.querySelector('#passwordForm'),passwordError=document.querySelector('#passwordError'),
      passwordSubmit=document.querySelector('#passwordSubmit'),orDivider=document.querySelector('#orDivider'),
      certButton=document.querySelector('#certButton'),certTitle=document.querySelector('#certTitle'),
      certDescription=document.querySelector('#certDescription'),certError=document.querySelector('#certError'),
      certRetry=document.querySelector('#certRetry'),certBack=document.querySelector('#certBack');
    let mtlsEnabled=false;
    function showPasswordForm(){
      passwordChoice.hidden=true;orDivider.hidden=!mtlsEnabled;
      passwordForm.hidden=false;document.querySelector('#username').focus();
    }
    passwordChoiceButton.addEventListener('click',showPasswordForm);
    passwordForm.addEventListener('submit',async event=>{
      event.preventDefault();passwordError.textContent='';
      passwordSubmit.disabled=true;
      try{
        const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.querySelector('#username').value,password:document.querySelector('#password').value})});
        if(response.ok){window.location.replace('/');return}
        passwordError.textContent=response.status===429?'Too many login attempts. Wait a few minutes and try again.':'Invalid username or password.';
      }catch(error){passwordError.textContent='Could not reach the Mapper server. '+error.message}
      finally{passwordSubmit.disabled=false}
    });
    function certStatus(title,description){
      certTitle.textContent=title;certDescription.textContent=description;
    }
    async function attemptCertificateLogin(){
      certError.textContent='';certRetry.hidden=true;certBack.hidden=true;
      certStatus('Authenticating…','Present your PKI card certificate if the browser prompts for one.');
      try{
        const response=await fetch('/api/login/certificate',{method:'POST'});
        if(response.ok){window.location.replace('/');return}
        certStatus('Certificate login failed',await response.text());
        certError.textContent='Certificate login failed.';
        certRetry.hidden=false;certBack.hidden=false;
      }catch(error){
        certStatus('Certificate login failed','Could not reach the Mapper server. '+error.message);
        certRetry.hidden=false;certBack.hidden=false;
      }
    }
    certButton.addEventListener('click',()=>{
      mainView.hidden=true;certView.hidden=false;
      if(!mtlsEnabled){
        certStatus('Certificate login is not enabled','This server has no client certificate authority configured. Use username and password instead.');
        certBack.hidden=false;
        return;
      }
      attemptCertificateLogin();
    });
    certRetry.addEventListener('click',attemptCertificateLogin);
    (async function init(){
      try{
        const response=await fetch('/api/server-info');
        if(!response.ok)throw Error(await response.text());
        const info=await response.json();
        if(info.locked){lockedPanel.hidden=false;return}
        mtlsEnabled=!!info.mtls_enabled;
        mainView.hidden=false;
        if(mtlsEnabled){passwordChoice.hidden=false}
        else{showPasswordForm()}
      }catch(error){
        mainView.hidden=false;showPasswordForm();
        passwordError.textContent='Could not reach the Mapper server. '+error.message;
      }
    })();
  </script>
</body>
</html>
